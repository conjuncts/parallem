[project]
name = "pipelinellm"
version = "0.0.1"
description = "Beta prerelease - do not use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "openai>=1.107.2",
    "pillow>=10.0.0",
    "polars>=1.32.3",
]

[tool.setuptools.packages.find]
include = ["pipelinellm*"]

[dependency-groups]
dev = [
    "anthropic>=0.69.0",
    "google-genai>=1.41.0",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.1.1",
    "tabulate>=0.9.0",
]

[tool.ruff]
lint.ignore = ["E261"]
