[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "parallem"
version = "0.0.1"
description = "A library for building LLM pipelines with built-in support for batch processing and multi-provider compatibility. Beta prerelease - use at your own risk."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "conjuncts"}
]
keywords = [
    "llm",
    "openai",
    "anthropic",
    "google",
    "batch",
    "pipeline",
    "ai",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "colorama>=0.4.6",
    "openai>=1.107.2",
    "pillow>=10.0.0",
    "polars>=1.32.3",
]

[tool.setuptools.packages.find]
include = ["parallem*"]

[project.urls]
Homepage = "https://github.com/conjuncts/parallem"
Repository = "https://github.com/conjuncts/parallem"
Issues = "https://github.com/conjuncts/parallem/issues"

[dependency-groups]
dev = [
    "anthropic>=0.77.0",
    "flit>=3.12.0",
    "mkdocs-material>=9.6.18",
    "google-genai>=1.41.0",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.1.1",
    "tabulate>=0.9.0",
    "click==8.2.1",  # https://github.com/mkdocs/mkdocs/issues/4032
]
docs = [
    "mkdocs-material>=9.6.18",
]

[tool.flit.sdist]
include = ["parallem/**/*.py", "README.md", "parallem/py.typed"]
exclude = [
    "*.tsv",
    "*.yaml",
    "*.zip",
    "CHANGELOG.md",
    "philosophy.md",
    "TODO.md",
    "comparison.md",
    "data/**/*",
    "dev.md",
    "docs/**/*",
    "notebooks/**/*",
    "examples/**/*",
    "experiments/**/*",
    "reading_list.md",
    "samples/**/*",
    "tests/**/*",
    "uv.lock",
    ".github",
    ".git*",
]


[tool.ruff]
lint.ignore = ["E261"]

[tool.pytest.ini_options]
addopts = "--durations=10"
