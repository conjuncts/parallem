site_name: parallem
site_description: Batch-first Python workflows for LLM pipelines.
repo_name: conjuncts/parallem
repo_url: https://github.com/conjuncts/parallem
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Philosophy: philosophy.md
  - Your first agent: agent_pattern.md
  - Quickstart: quickstart.md
  - Concepts:
    - Ask: concepts/ask.md
    - MessageState: concepts/msg_state.md
    - Persistence: concepts/persistence.md
    - Strategies: concepts/strategies.md
    - Memoize: concepts/memoize.md
  - Use cases:
    - Many documents: use-cases/document_processing.md
    - Chatbot: use-cases/multiple_conversations.md
    - Subagents: use-cases/subagents.md
    - Aggregation: use-cases/aggregation.md
    - RAG: use-cases/rag.md



extra_css:
  - stylesheets/extra.css